[workspace]
resolver = "2"
members = [
    "crates/core",
    "src-tauri",
]
default-members = ["crates/core"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
thiserror = "1"
regex = "1"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
