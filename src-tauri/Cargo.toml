[package]
name = "endpoint-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Endpoint Tauri 应用:网文 txt → EPUB / kepub。"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
endpoint-core = { path = "../crates/core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "endpoint-app"
path = "src/main.rs"
