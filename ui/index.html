<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>Endpoint</title>
  <style>
    :root {
      --fg: #1f2933;
      --muted: #52606d;
      --border: #cbd2d9;
      --ok: #2e7d32;
      --err: #c62828;
      --bg: #f5f7fa;
    }
    * { box-sizing: border-box; }
    body {
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      margin: 0;
      padding: 28px;
      background: var(--bg);
      color: var(--fg);
      max-width: 720px;
    }
    h1 { font-size: 18px; margin: 0 0 4px 0; }
    .subtitle { color: var(--muted); font-size: 13px; margin-bottom: 24px; }
    .row { margin-bottom: 14px; }
    label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
    .input-group { display: flex; gap: 6px; }
    input[type=text] {
      flex: 1;
      padding: 6px 8px;
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 13px;
      background: #fff;
    }
    button {
      padding: 6px 14px;
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 4px;
      font-size: 13px;
      cursor: pointer;
    }
    button:hover { background: #eef1f5; }
    button.primary {
      background: #1f6feb;
      color: #fff;
      border-color: #1f6feb;
      padding: 8px 22px;
      font-size: 14px;
    }
    button.primary:hover { background: #1858c4; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .status {
      margin-top: 18px;
      padding: 10px 12px;
      border-radius: 4px;
      font-family: Consolas, "Cascadia Mono", monospace;
      font-size: 12px;
      white-space: pre-wrap;
      min-height: 32px;
      background: #fff;
      border: 1px solid var(--border);
    }
    .status.ok { color: var(--ok); border-color: #a5d6a7; background: #e8f5e9; }
    .status.err { color: var(--err); border-color: #ef9a9a; background: #ffebee; }
    .stage-hint {
      font-size: 11px;
      color: var(--muted);
      margin-top: 12px;
      font-style: italic;
    }
  </style>
</head>
<body>
  <h1>txt → EPUB</h1>
  <div class="subtitle">阶段一:核心库文本处理已扎实,界面仍为简易壳</div>

  <div class="row">
    <label>输入 txt 文件(编码自动探测:UTF-8 / GBK / GB18030 / UTF-16)</label>
    <div class="input-group">
      <input type="text" id="input" placeholder="点右侧按钮选择..." readonly />
      <button id="pickInput">选择文件</button>
    </div>
  </div>

  <div class="row">
    <label>输出 epub 文件</label>
    <div class="input-group">
      <input type="text" id="output" placeholder="点右侧按钮选择保存位置..." readonly />
      <button id="pickOutput">选择保存位置</button>
    </div>
  </div>

  <div class="row">
    <label>书名</label>
    <input type="text" id="title" placeholder="例如:斗破苍穹" />
  </div>

  <div class="row">
    <label>作者</label>
    <input type="text" id="author" placeholder="例如:天蚕土豆" />
  </div>

  <div class="row">
    <label>kepubify 可执行文件路径(可选;留空则只生成 epub,不做 Kobo 优化)</label>
    <div class="input-group">
      <input type="text" id="kepubify" placeholder="例如:C:\tools\kepubify.exe" />
      <button id="pickKepubify">选择...</button>
    </div>
  </div>

  <button class="primary" id="generate">生成</button>

  <div class="status" id="status">等待操作。</div>

  <div class="stage-hint">
    阶段一已具备:多编码自动探测、文本清洗(空行/空白/控制字符)、规则库化的章节识别(第X章/回/话/节、楔子/序章/番外)、卷识别(第X卷/部、卷X、上中下卷)、两级 TOC。
    阶段二将上 VS Code 式三栏界面与进度条;阶段三接水印智能。
  </div>

  <script src="main.js"></script>
</body>
</html>
